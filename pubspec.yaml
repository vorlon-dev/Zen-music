# ZenMusic · vorlon-dev

name: zenmusic
description: "A YouTube zen player built with Flutter."
publish_to: 'none'

version: 31.10.2026+4

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  just_audio:
    path: packages/just_audio
  youtube_explode_dart:
    path: packages/youtube_explode_dart
  audio_service: ^0.18.18
  audio_session: ^0.1.21
  http: ^1.2.2

  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  web_socket_channel: ^3.0.3
  cached_network_image: ^3.4.1
  permission_handler: ^11.3.1
  provider: ^6.1.2
  liquid_glass_widgets: ^1.15.1
  flutter_file_dialog: ^3.3.3
  video_player: ^2.9.2
  fluentui_system_icons: ^1.1.273
  file_picker: ^13.1.0
  palette_generator: ^0.3.3+7
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.3
  google_fonts: ^9.0.0
  go_router: ^18.0.2
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  path_provider: ^2.1.6
  media_kit: ^1.2.6
  media_kit_libs_windows_video: ^1.0.11
  rxdart: ^0.28.0
  text_scroll: ^0.2.1
  loading_indicator_m3e: ^0.1.1
  just_audio_background:
    path: packages/just_audio_background
  just_audio_media_kit: ^2.1.0
  media_kit_native_event_loop: ^1.0.9
  share_plus: ^13.0.0
  duration_picker: ^1.2.0
  flutter_colorpicker: ^1.1.0
  expressive_refresh: ^0.1.2
  internet_connection_checker_plus: ^2.9.1
  flutter_staggered_grid_view: ^0.7.0
  html: ^0.15.0
  expandable_page_view: ^1.0.17
  expandable_text: ^2.3.0
  intl: any
  path: ^1.9.0
  collection: ^1.19.1
  fuzzywuzzy: ^1.2.0
  flutter_swipe_action_cell: ^3.1.3
  easy_folder_picker: ^1.3.3
  in_app_webview_flutter: ^1.1.0
  desktop_webview_window: ^0.3.2
  ffi: ^2.1.3
  pub_semver: ^2.1.4
  flutter_markdown_plus: ^1.0.4
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.3.6
  smtc_windows: ^1.1.0
  flutter_discord_rpc: ^1.1.0
  desktop_multi_window: 0.2.1
dependency_overrides:
  flutter_inappwebview_windows_fx:
    path: ./windows_webview_stub

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/logos/
    - assets/icon/

  fonts:
    - family: Retro Blendy
      fonts:
        - asset: assets/fonts/Retro Blendy.otf
    - family: ZenSansFlex
      fonts:
        - asset: assets/fonts/gflex_variable.ttf

flutter_launcher_icons:
  image_path: "assets/icon/logo.png"
  windows:
    generate: true
