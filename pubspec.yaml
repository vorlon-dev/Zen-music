name: zenmusic
description: "A YouTube music player built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.3
  # ─────────────────────────────────────────────
  # 🎵 YouTube Extraction & Audio Playback
  # ─────────────────────────────────────────────
  yt_extractor: ^0.1.0
  youtube_explode_dart: ^3.1.0
  just_audio: ^0.10.6
  audio_service: ^0.18.18
  audio_session: ^0.1.21
  # WebView for YouTube embed video mode
  webview_flutter: ^4.10.0

  # ─────────────────────────────────────────────
  # 📝 Lyrics
  # ─────────────────────────────────────────────
  flutter_lyric: ^3.0.8                # ← UPDATED
  http: ^1.2.2

  # ─────────────────────────────────────────────
  # 📦 Local Storage & State
  # ─────────────────────────────────────────────
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fixnum: ^1.1.0
  web_socket_channel: ^3.0.3
  protobuf: ^6.1.0
  # ─────────────────────────────────────────────
  # 🌐 Networking & Utilities
  # ─────────────────────────────────────────────
  cached_network_image: ^3.4.1
  permission_handler: ^11.3.1

  # ─────────────────────────────────────────────
  # 🎨 UI / State Management
  # ─────────────────────────────────────────────
  provider: ^6.1.2
  material_symbols_icons: ^4.2801.1
  palette_generator_master: ^1.1.0
  # ─────────────────────────────────────────────
  # 🎬 Track 2: extracted-stream video backdrop
  # ─────────────────────────────────────────────
  darttubefix: ^1.0.8
  video_player: ^2.9.2
  fluentui_system_icons: ^1.1.273
  file_picker: ^13.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  fonts:
    - family: PaytoneOne
      fonts:
        - asset: assets/fonts/PaytoneOne-Regular.ttf