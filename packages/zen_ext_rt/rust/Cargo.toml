[package]
name = "zen_ext_rt"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
rquickjs = { version = "0.9", default-features = false }
ureq = { version = "2", default-features = false, features = ["tls"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md5 = "0.7"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
