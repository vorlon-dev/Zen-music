name: zen_engine
description: "A complete, headless music engine for Flutter providing JioSaavn, YouTube Music, synced lyrics, lossless streaming, downloads, queue and playback management."
version: 1.0.0
homepage: https://github.com/vorlon-dev/Zen-music
repository: https://github.com/vorlon-dev/Zen-music/tree/main/packages/zen_engine
issue_tracker: https://github.com/vorlon-dev/Zen-music/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  crypto: ^3.0.7
  just_audio: ^0.9.46
  audio_service: ^0.18.18
  youtube_explode_dart: ^2.4.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  rxdart: ^0.28.0
  web_socket_channel: ^3.0.3
  path_provider: ^2.1.5
  path: ^1.9.0
  collection: ^1.19.1
  fuzzywuzzy: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
