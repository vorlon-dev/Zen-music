name: Web Player

# Builds the web player (lib/web/web_main.dart) and deploys it, together with
# the backend in backend/functions, to Cloudflare Pages. Android/Windows are untouched.
#
# Repository secrets needed for deploy (Settings > Secrets > Actions):
#   CLOUDFLARE_API_TOKEN   token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  your account id
# Optional repository variable: CLOUDFLARE_PROJECT (default: zenmusic-d6t)

on:
  push:
    branches: [main]
    paths:
      - 'lib/web/**'
      - 'web/**'
      - 'backend/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Test API functions
        run: node test/api/v1.test.mjs

      - name: Test web code
        run: flutter test test/web_models_test.dart test/web_store_test.dart

      - name: Build web
        run: flutter build web -t lib/web/web_main.dart --release

      - name: Create Pages project if missing
        if: ${{ env.CF_TOKEN != '' }}
        run: >
          npx --yes wrangler@3 pages project create
          "${{ vars.CLOUDFLARE_PROJECT || 'zenmusic-d6t' }}"
          --production-branch=main || echo "Project exists or could not be created; continuing."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Add backend functions to the deploy
        run: cp -r backend/functions functions

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_TOKEN != '' }}
        run: >
          npx --yes wrangler@3 pages deploy build/web
          --project-name="${{ vars.CLOUDFLARE_PROJECT || 'zenmusic-d6t' }}"
          --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Skip notice
        if: ${{ env.CF_TOKEN == '' }}
        run: echo "CLOUDFLARE_API_TOKEN not set; build succeeded, deploy skipped."
