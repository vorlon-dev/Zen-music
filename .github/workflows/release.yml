name: Release

on:
  push:
    tags:
      - 'v*'
  # Run it by hand (Actions -> Release -> Run workflow) to build from any
  # branch; the release tag is then taken from pubspec.yaml (vX.Y.Z).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (blank = v<pubspec version>)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${{ env.VERSION }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            V="${{ inputs.tag }}"
          else
            V="v$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//')"
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "Building $V"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Patch flutter_discord_rpc cargokit (compileSdk "android-37.0" parse bug)
        shell: bash
        run: |
          F=$(ls $HOME/.pub-cache/hosted/pub.dev/flutter_discord_rpc-*/cargokit/gradle/plugin.gradle 2>/dev/null | head -1)
          if [ -z "$F" ]; then echo "flutter_discord_rpc not found, skipping"; exit 0; fi
          echo "Patching $F"
          echo "--- before ---"; grep -n "compileSdkVersion = " "$F"
          sed -i 's/\.substring(8) as int/.substring(8).toDouble().intValue()/' "$F"
          echo "--- after ---";  grep -n "compileSdkVersion = " "$F"
          grep -q "toDouble().intValue()" "$F" || { echo "PATCH DID NOT APPLY"; exit 1; }
      - name: Build universal APK
        run: flutter build apk --release

      - name: Build split-per-ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: Organize artifacts
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/zenmusic-${{ env.VERSION }}-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/zenmusic-${{ env.VERSION }}-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release/zenmusic-${{ env.VERSION }}-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release/zenmusic-${{ env.VERSION }}-x86_64.apk

      - name: Upload build artifacts (workflow run backup)
        uses: actions/upload-artifact@v4
        with:
          name: zenmusic-apks-${{ env.VERSION }}
          path: release/*.apk

      - name: Compose release notes
        shell: bash
        run: |
          N="release-notes/${VERSION}.md"
          if [ -f "$N" ]; then cp "$N" body.md; else echo "## ZenMusic ${VERSION}" > body.md; fi
          cat >> body.md <<'DL'

          ## Downloads

          | File | Best for |
          |---|---|
          | `zenmusic-*-universal.apk` | Most devices — works everywhere |
          | `zenmusic-*-arm64-v8a.apk` | Modern phones (2017+) — smaller download |
          | `zenmusic-*-armeabi-v7a.apk` | Older 32-bit phones |
          | `zenmusic-*-x86_64.apk` | Emulators and x86 tablets |

          Install the universal APK if unsure. Splits are smaller but must match your device's ABI.
          DL

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ZenMusic ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: release/*.apk
          body_path: body.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}