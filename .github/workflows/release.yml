name: Release

# Push a tag like v25.11.2026 to build and publish the Android APKs.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SYMBOLS_DIR: build/symbols

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      # Optional: sign with your own key so every release can update the last
      # one. Without these secrets the build still works, but it is signed with
      # a throw-away debug key (users must uninstall before updating).
      # Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Set up release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 secret not set - signing with the throw-away debug key"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          echo "Release signing configured"

      # Small per-device APKs: arm64-v8a (modern phones), armeabi-v7a (old
      # 32-bit phones) and x86_64 (emulators / x86 tablets).
      - name: Build per-ABI APKs
        run: >
          flutter build apk --release --split-per-abi
          --obfuscate --split-debug-info=${{ env.SYMBOLS_DIR }}

      # The universal APK only carries the two ARM ABIs (x86_64 is only for
      # emulators and has its own APK) - this alone saves ~30% of its size.
      - name: Build universal APK (arm64 + arm32)
        run: >
          flutter build apk --release --target-platform android-arm,android-arm64
          --obfuscate --split-debug-info=${{ env.SYMBOLS_DIR }}

      - name: Organize artifacts
        run: |
          set -e
          OUT=build/app/outputs/flutter-apk
          for f in app-release app-arm64-v8a-release app-armeabi-v7a-release app-x86_64-release; do
            test -f "$OUT/$f.apk" || { echo "::error::missing $f.apk"; exit 1; }
          done
          mkdir -p release
          cp "$OUT/app-release.apk"             "release/zenmusic-${{ github.ref_name }}-universal.apk"
          cp "$OUT/app-arm64-v8a-release.apk"   "release/zenmusic-${{ github.ref_name }}-arm64-v8a.apk"
          cp "$OUT/app-armeabi-v7a-release.apk" "release/zenmusic-${{ github.ref_name }}-armeabi-v7a.apk"
          cp "$OUT/app-x86_64-release.apk"      "release/zenmusic-${{ github.ref_name }}-x86_64.apk"
          ls -lh release
          {
            echo "### APK sizes"
            echo "| File | Size |"
            echo "|---|---|"
            for f in release/*.apk; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      # Needed to read obfuscated crash stack traces (flutter symbolize).
      - name: Zip debug symbols
        run: cd build && zip -rq ../symbols-${{ github.ref_name }}.zip symbols

      - name: Upload build artifacts (workflow run backup)
        uses: actions/upload-artifact@v4
        with:
          name: zenmusic-apks-${{ github.ref_name }}
          path: |
            release/*.apk
            symbols-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          generate_release_notes: true
          body: |
            ## Downloads

            | File | Best for |
            |---|---|
            | `zenmusic-*-arm64-v8a.apk` | **Most phones (2017+) - smallest download** |
            | `zenmusic-*-universal.apk` | Not sure? Works on every ARM phone (arm64 + arm32) |
            | `zenmusic-*-armeabi-v7a.apk` | Older 32-bit phones |
            | `zenmusic-*-x86_64.apk` | Emulators and x86 tablets |

            Install `arm64-v8a` if unsure - it is the smallest.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
