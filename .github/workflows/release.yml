name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Build universal APK
        run: flutter build apk --release

      - name: Build split-per-ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: Organize artifacts
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/zenmusic-${{ github.ref_name }}-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/zenmusic-${{ github.ref_name }}-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release/zenmusic-${{ github.ref_name }}-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release/zenmusic-${{ github.ref_name }}-x86_64.apk

      - name: Upload build artifacts (workflow run backup)
        uses: actions/upload-artifact@v4
        with:
          name: zenmusic-apks-${{ github.ref_name }}
          path: release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          generate_release_notes: true
          body: |
            ## Downloads

            | File | Best for |
            |---|---|
            | `zenmusic-*-universal.apk` | Most devices — works everywhere |
            | `zenmusic-*-arm64-v8a.apk` | Modern phones (2017+) — smaller download |
            | `zenmusic-*-armeabi-v7a.apk` | Older 32-bit phones |
            | `zenmusic-*-x86_64.apk` | Emulators and x86 tablets |

            Install the universal APK if unsure. Splits are smaller but must match your device's ABI.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}