name: Desktop Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build Windows exe (desktop entrypoint, release)
        run: flutter build windows --release -t lib/desktop/main.dart

      - name: Extract version from tag
        id: ver
        shell: bash
        run: |
          # Remove 'v' prefix and replace '+' with '_' for safe filenames
          RAW_VERSION=${GITHUB_REF_NAME#v}
          SAFE_VERSION=${RAW_VERSION//+/-}
          echo "VERSION=$SAFE_VERSION" >> $GITHUB_OUTPUT

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Installer
        shell: pwsh
        run: |
          $env:PATH = "${env:PATH};C:\Program Files (x86)\Inno Setup 6"
          iscc /DMyAppVersion="${{ steps.ver.outputs.VERSION }}" windows\installer.iss
          Write-Host "=== Checking Output Directory ==="
          if (Test-Path "windows\Output") {
            Get-ChildItem -Path "windows\Output"
          } else {
            Write-Host "Error: windows\Output directory not found!"
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ZenMusic Desktop v${{ steps.ver.outputs.VERSION }}
          body: |
            ## ZenMusic Desktop v${{ steps.ver.outputs.VERSION }}

            One-time installer for Windows. Download, run the `.exe`, and follow the setup wizard.

            ### Notes
            - First launch may be slow (extracts mpv/native libs).
            - If the UI renders blank/white on some GPUs, update your GPU driver.
            - Requires Windows 10 or newer (x64).

            See the repository for source and license (GPL-3.0).
          # Use wildcard to catch the .exe regardless of exact version string formatting
          files: |
            windows/Output/*.exe
          draft: false
          prerelease: false