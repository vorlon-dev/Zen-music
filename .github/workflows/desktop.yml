name: Desktop Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      # ▼▼▼ ADD THIS STEP TO FIX THE CMAKE ERROR ▼▼▼
      - name: Patch broken Windows WebView plugin
        shell: pwsh
        run: |
          $pubCache = "$env:LOCALAPPDATA\Pub\Cache\hosted\pub.dev"
          $pluginPath = Get-ChildItem -Path $pubCache -Filter "in_app_webview_flutter*" | Select-Object -First 1
          if ($pluginPath) {
            $winDir = Join-Path $pluginPath.FullName "windows"
            if (Test-Path $winDir) {
              Remove-Item -Recurse -Force $winDir
              Write-Host "✅ Patched: Removed broken Windows folder from in_app_webview_flutter"
            }
          }
      # ▲▲▲ END OF PATCH ▲▲▲

      - name: Build Windows exe (desktop entrypoint, release)
        run: flutter build windows --release -t lib/desktop/main.dart

      - name: Extract version from tag
        id: ver
        shell: bash
        run: |
          RAW_VERSION=${GITHUB_REF_NAME#v}
          SAFE_VERSION=${RAW_VERSION//+/-}
          echo "VERSION=$SAFE_VERSION" >> $GITHUB_OUTPUT

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Installer
        shell: pwsh
        run: |
          $env:PATH = "${env:PATH};C:\Program Files (x86)\Inno Setup 6"
          iscc /DMyAppVersion="${{ steps.ver.outputs.VERSION }}" windows\installer.iss
          if (Test-Path "windows\Output") {
            Get-ChildItem -Path "windows\Output"
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ZenMusic Desktop v${{ steps.ver.outputs.VERSION }}
          body: |
            ## ZenMusic Desktop v${{ steps.ver.outputs.VERSION }}
            One-time installer for Windows. Download, run the `.exe`, and follow the setup wizard.
          files: |
            windows/Output/*.exe
          draft: false
          prerelease: false