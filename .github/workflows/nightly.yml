name: Nightly Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: flutter pub get

      - name: Set up release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 secret not set - signing with the throw-away debug key"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties

      - name: Build per-ABI APKs
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols

      - name: Build universal APK (arm64 + arm32)
        run: flutter build apk --release --target-platform android-arm,android-arm64 --obfuscate --split-debug-info=build/symbols

      - name: Rename artifacts
        run: |
          set -e
          OUT=build/app/outputs/flutter-apk
          mkdir out
          cp $OUT/app-arm64-v8a-release.apk   out/zenmusic-nightly-arm64-v8a.apk
          cp $OUT/app-armeabi-v7a-release.apk out/zenmusic-nightly-armeabi-v7a.apk
          cp $OUT/app-x86_64-release.apk      out/zenmusic-nightly-x86_64.apk
          cp $OUT/app-release.apk             out/zenmusic-nightly-universal.apk
          ls -lh out

      - name: Replace nightly release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly out/*.apk --prerelease \
            --title "Nightly build" \
            --notes "Automated build from main. Unstable - prefer the latest stable release."
