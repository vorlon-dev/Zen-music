name: Nightly Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - name: Patch flutter_discord_rpc cargokit (SDK "37.0" parse bug)
        shell: bash
        run: |
          F=$(ls $HOME/.pub-cache/hosted/pub.dev/flutter_discord_rpc-*/cargokit/gradle/plugin.gradle 2>/dev/null | head -1)
          if [ -z "$F" ]; then echo "flutter_discord_rpc not found, skipping"; exit 0; fi
          echo "Patching $F"
          echo "--- before (line 163) ---"; sed -n "163p" "$F"
          sed -i "163s/\\.toInteger()/.toDouble().intValue()/g; 163s/Integer\\.parseInt(\\([^)]*\\))/Double.parseDouble(\\1).intValue()/g" "$F"
          echo "--- after (line 163) ---";  sed -n "163p" "$F"
      - run: flutter build apk --release --split-per-abi
      - run: flutter build apk --release
      - name: Rename artifacts
        run: |
          mkdir out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/zenmusic-nightly-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/zenmusic-nightly-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk out/zenmusic-nightly-x86_64.apk
          cp build/app/outputs/flutter-apk/app-release.apk out/zenmusic-nightly-universal.apk
      - name: Replace nightly release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly out/*.apk --prerelease \
            --title "Nightly build" \
            --notes "Automated build from main. Unstable — prefer the latest stable release."