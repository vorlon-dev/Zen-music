name: Nightly Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No release keystore configured; building with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" "$RUNNER_TEMP/release.jks" \
            > android/key.properties

      - run: flutter build apk --release --split-per-abi
      - run: flutter build apk --release
      - name: Rename artifacts
        run: |
          mkdir out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/zenmusic-nightly-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/zenmusic-nightly-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk out/zenmusic-nightly-x86_64.apk
          cp build/app/outputs/flutter-apk/app-release.apk out/zenmusic-nightly-universal.apk
      - name: Replace nightly release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly out/*.apk --prerelease \
            --title "Nightly build" \
            --notes "Automated build from main. Unstable — prefer the latest stable release."